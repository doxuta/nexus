name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: go (vet · gofmt · test -race · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nexus-platform/go.mod
          cache-dependency-path: nexus-platform/go.sum
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean — run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go test ./... -race
      - name: acceptance-gate unit tests
        run: |
          python3 scripts/test_acceptance_acl.py
          python3 scripts/test_acceptance_named_credentials.py

  integration:
    name: go integration (MySQL 8 · migrate up · -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-platform
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexus_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nexus-platform/go.mod
          cache-dependency-path: nexus-platform/go.sum
      - name: golang-migrate CLI
        run: go install -tags 'mysql' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
      - name: raise the connection ceiling (suites open many pools)
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL max_connections = 1000;"
      - name: migrate up
        run: migrate -path migrations -database "mysql://root:root@tcp(127.0.0.1:3306)/nexus_platform" up
      - name: integration tests (real MySQL, real migrations; an all-SKIP run fails)
        env:
          TEST_DATABASE_URL: "root:root@tcp(127.0.0.1:3306)/nexus_platform?charset=utf8mb4&parseTime=true&multiStatements=true&loc=UTC&clientFoundRows=true"
        # internal/services alone runs past 25 min under -race on a 4-vCPU hosted runner
        run: bash scripts/run-integration.sh ./... -race -timeout 50m -p 2

  web:
    name: web (build · tsc · vitest · eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-web/package-lock.json
      - run: npm ci
      # build before tsc: next-env.d.ts and .next/types are generated by the build, and tsconfig includes them
      - run: npm run build
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run lint

  demo:
    name: one-command demo (docker compose up · seed · sign in as the rep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up --build -d
      - name: wait for the seed to finish
        run: |
          code=$(docker wait nexus-seed-1)
          docker compose logs seed
          [ "$code" = 0 ]
      - name: the sales rep signs in through the same origin the browser uses
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"tenant":"northwind","email":"test@example.com","password":"Demo-Rep-2026!"}' | grep -q accessToken
          curl -fsS -o /dev/null http://localhost:8080/
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 200

  demo-loop:
    name: demo loop (compose · AI replayed from the cassette · builder and rep in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-web/package-lock.json
      - name: docker compose up, the assistant answering from cassettes/demo-loop.jsonl (no model, no key)
        env:
          AI_ENABLED: "true"
          AI_GATEWAY_MODE: replay
          AI_GATEWAY_CASSETTE: /cassettes/demo-loop.jsonl
        run: docker compose up --build -d
      - name: puppeteer-core
        working-directory: nexus-web
        run: npm ci
      - name: wait for the seed to finish
        run: |
          code=$(docker wait nexus-seed-1)
          docker compose logs seed
          [ "$code" = 0 ]
      - name: the loop, in the runner's Chrome
        working-directory: nexus-web
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/demo-loop.mjs ../demo-loop-shots
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-loop-screenshots
          path: demo-loop-shots/
          if-no-files-found: ignore
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail 300
